name: Test word game logic
on:
  push:
    branches: [main, feat/mobile-wordle-pwa]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run unit tests
        run: |
          node --check app.js
          node --check logic.mjs
          node --check sw.js
          node --test tests/logic.test.mjs
